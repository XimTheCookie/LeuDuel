@if (settingsService.landscapeMode()) {
  <div class="duel-page duel-page--landscape">
    <div class="duel-page__lp-col">
      <div
        class="duel-page__lp-row"
        [class.duel-page__lp-row--swap]="settingsService.swapPlayers()"
      >
        <div
          class="duel-page__lp-cell"
          [class.duel-page__lp-cell--selected]="selectedPlayer() === 'player1'"
          [class.duel-page__lp-cell--swap]="settingsService.swapPlayers()"
          (click)="onLpClick('player1')"
        >
          <app-life-points
            [compact]="true"
            [lifePoints]="lifePoints1()"
            [playerName]="playerName1()"
          />
        </div>
        <app-duel-controller class="duel-page__controller" />
        <div
          class="duel-page__lp-cell duel-page__lp-cell--right"
          [class.duel-page__lp-cell--selected]="selectedPlayer() === 'player2'"
          [class.duel-page__lp-cell--swap]="settingsService.swapPlayers()"
          (click)="onLpClick('player2')"
        >
          <app-life-points
            [compact]="true"
            [lifePoints]="lifePoints2()"
            [playerName]="playerName2()"
          />
        </div>
      </div>
      <div
        class="duel-page__lp-wins"
        [class.duel-page__lp-wins--swap]="settingsService.swapPlayers()"
      >
        <app-wins-bar class="w-full" [wins]="wins1()" />
        <app-wins-bar class="w-full" [wins]="wins2()" />
      </div>
    </div>

    <app-landscape-actions
      class="duel-page__landscape-actions"
      [selectedPlayer]="selectedPlayer()"
    />
  </div>
} @else {
  <div class="duel-page">
    <div class="duel-page__panel duel-page__panel--opponent mirror">
      <app-player-panel player="player2"></app-player-panel>
    </div>
    <app-duel-controller />
    <div class="duel-page__panel">
      <app-player-panel player="player1"></app-player-panel>
    </div>
  </div>
}
