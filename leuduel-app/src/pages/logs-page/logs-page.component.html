<div class="logs-page">
  <div class="logs-page__header">
    <span class="logs-page__title">{{ 'logs.title' | translate }}</span>
    <span class="logs-page__count">
      {{ 'logs.events' | translate: { count: logs().length.toString() } }}
    </span>
  </div>

  <div class="logs-page__list">
    @if (logs().length === 0) {
      <div class="logs-page__empty">
        <app-icon icon="log" size="lg" />
        <span>
          {{ 'logs.no-events' | translate }}
        </span>
      </div>
    } @else {
      @for (log of logs(); let i = $index; track i) {
        <app-log-item
          [lifeLog]="log"
          [undoable]="log.undoable"
          (undo)="undoChange(log.timestamp)"
          [playerProfile1]="playerProfile1()"
          [playerProfile2]="playerProfile2()"
        />
      }
    }
  </div>
</div>
