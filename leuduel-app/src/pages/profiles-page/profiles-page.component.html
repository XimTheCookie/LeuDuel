<div class="profiles-page">
  <div class="settings-section">
    <h2 class="settings-section__title">
      <span class="settings-section__title-icon">◈</span>
      {{ 'profiles-page.my-profile' | translate }}
    </h2>
    <div class="settings-section__fields">
      @if (playerStore.main(); as main) {
        <div class="profile-row">
          <app-player-profile [profile]="main" />
        </div>
      }
    </div>
    <div class="settings-section__footer">
      <app-text-button
        label="profiles-page.edit-profile"
        tone="neutral"
        (clicked)="openMainEditor()"
      />
    </div>
  </div>

  <div class="settings-section">
    <h2 class="settings-section__title">
      <span class="settings-section__title-icon">⚔</span>
      {{ 'profiles-page.opponents' | translate }}
    </h2>
    <div class="settings-section__fields">
      @for (opponent of playerStore.opponents(); track opponent.id) {
        <div class="profile-row">
          <app-player-profile [profile]="opponent" />
          <div class="profile-row__actions">
            <app-button
              icon="edit"
              tone="neutral"
              (clicked)="openEditOpponent(opponent)"
              size="xs"
            />
            <app-button
              icon="x"
              tone="negative"
              (clicked)="removeOpponent(opponent.id)"
              size="xs"
            />
          </div>
        </div>
      } @empty {
        <span class="profiles-page__empty">
          {{ 'profiles-page.no-opponents' | translate }}
        </span>
      }
    </div>
    <div class="settings-section__footer">
      <app-text-button
        label="profiles-page.add-opponent"
        tone="neutral"
        (clicked)="openAddOpponent()"
      />
    </div>
  </div>
</div>
