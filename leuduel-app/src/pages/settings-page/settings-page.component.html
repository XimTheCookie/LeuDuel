<div class="settings-page">
  <div class="settings-section">
    <h2 class="settings-section__title">
      <span class="settings-section__title-icon">⚔</span> Duel Settings
    </h2>
    <div class="settings-section__fields">
      <app-number-input
        [formControl]="lifePoints"
        label="Starting Life Points"
        [maxValue]="9999999"
        [minValue]="1"
        [step]="1000"
        [canReset]="true"
        (doReset)="lpReset()"
      />
      <app-number-input
        [formControl]="bestOf"
        label="Best of"
        [maxValue]="9"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetBestOf()"
      />
      <app-time-input
        [formControl]="duration"
        label="Duel Timer"
        [canReset]="true"
        (doReset)="resetTimer()"
      />
      <label class="settings-section__toggle-row">
        <span class="toggle-label">Use custom profiles</span>
        <input
          type="checkbox"
          [checked]="showCustomPlayers.value!"
          (change)="showCustomPlayers.setValue($any($event.target).checked)"
        />
      </label>
      <app-text-button
        (clicked)="openProfiles()"
        label="Customize player profiles"
        tone="neutral"
      />
    </div>
    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveDuelSettings()"
        [isDisabled]="!duelSettingsValid() || duelSettingsUnchanged()"
        label="Save changes"
        [tone]="!duelSettingsValid() ? 'warning' : duelSettingsUnchanged() ? 'neutral' : 'positive'"
      />
    </div>
  </div>

  <div class="settings-section">
    <h2 class="settings-section__title">
      <span class="settings-section__title-icon">◈</span> Gui settings
    </h2>
    <div class="settings-section__fields">
      <app-number-input
        [formControl]="modalOpacity"
        label="Window opacity"
        [maxValue]="10"
        [minValue]="6"
        [step]="1"
        [canReset]="true"
        (doReset)="resetOpacity()"
      />
      <label class="settings-section__toggle-row">
        <span class="toggle-label">Dark mode</span>
        <input
          type="checkbox"
          [checked]="darkMode.value!"
          (change)="darkMode.setValue($any($event.target).checked)"
        />
      </label>
      <label class="settings-section__toggle-row">
        <span class="toggle-label">Landscape mode</span>
        <input
          type="checkbox"
          [checked]="isLandscapeOrientation.value!"
          (change)="isLandscapeOrientation.setValue($any($event.target).checked)"
        />
      </label>
      <app-number-input
        [formControl]="numberOfRapidButtons"
        label="Number of rapid buttons"
        [maxValue]="15"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetRapidButtons()"
      />
      <app-number-input
        [formControl]="rapidButtonsColumns"
        label="Number of columns"
        [maxValue]="3"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetRapidButtonsColumns()"
      />
    </div>
    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveGuiPreferences()"
        [isDisabled]="!guiPreferencesValid() || guiPreferencesUnchanged()"
        label="Save changes"
        [tone]="
          !guiPreferencesValid() ? 'warning' : guiPreferencesUnchanged() ? 'neutral' : 'positive'
        "
      />
    </div>
  </div>

  @if (isAndroid) {
    <div class="settings-section">
      <h2 class="settings-section__title">
        <span class="settings-section__title-icon">◉</span> Android
      </h2>
      <div class="settings-section__fields">
        <label class="settings-section__toggle-row">
          <span class="toggle-label"
            >Keep Awake <span class="toggle-label__sub">during match</span></span
          >
          <input
            type="checkbox"
            [checked]="keepAwake.value!"
            (change)="keepAwake.setValue($any($event.target).checked)"
            [disabled]="keepAwake.disabled"
          />
        </label>
      </div>
      @if (keepAwakeSupported()) {
        <div class="settings-section__footer">
          <app-text-button
            (clicked)="saveKeepAwake()"
            [isDisabled]="keepAwakeUnchanged()"
            label="Save changes"
            [tone]="keepAwakeUnchanged() ? 'neutral' : 'positive'"
          />
        </div>
      }
    </div>
  }

  <div class="settings-section">
    <h2 class="settings-section__title">
      <span class="settings-section__title-icon">⚙</span> Behaviour Settings
    </h2>
    <div class="settings-section__fields">
      <span class="section-label"> Customize application behaviours </span>
    </div>
    <div class="settings-section__footer">
      <app-text-button (clicked)="openBehaviourSettings()" label="Open settings" tone="neutral" />
    </div>
  </div>

  <div class="settings-about">
    <app-text-button (clicked)="viewAboutModal()" label="About" tone="neutral" />
  </div>
</div>
