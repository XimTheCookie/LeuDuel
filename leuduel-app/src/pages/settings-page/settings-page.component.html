<div class="settings-page" [class.landscape]="landscapeMode()">
  <div class="settings-section">
    <h2 class="settings-section__title">Duel Settings</h2>

    <div class="settings-section__fields">
      <div class="settings-section__inline-pair">
        <app-number-input
          [formControl]="lifePoints"
          label="Starting Life Points"
          [maxValue]="9999999"
          [minValue]="1"
          [step]="1000"
          [canReset]="true"
          (doReset)="lpReset()"
        />

        <app-number-input
          [formControl]="bestOf"
          label="Best of"
          [maxValue]="9"
          [minValue]="1"
          [step]="1"
          [canReset]="true"
          (doReset)="resetBestOf()"
        />
      </div>

      <app-time-input
        [formControl]="duration"
        label="Duel Timer"
        [canReset]="true"
        (doReset)="resetTimer()"
      />
    </div>

    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveDuelSettings()"
        [isDisabled]="!duelSettingsValid()"
        label="Save changes"
        [tone]="!duelSettingsValid() ? 'warning' : duelSettingsUnchanged() ? 'neutral' : 'positive'"
      />
    </div>
  </div>

  <div class="settings-section">
    <h2 class="settings-section__title">GUI Preferences</h2>

    <div class="settings-section__fields">
      <div class="settings-section__inline-pair">
        <app-number-input
          [formControl]="numberOfRapidButtons"
          label="Number of rapid buttons"
          [maxValue]="15"
          [minValue]="1"
          [step]="1"
          [canReset]="true"
          (doReset)="resetRapidButtons()"
        />
        <app-number-input
          [formControl]="rapidButtonsColumns"
          [label]="isLandscapeOrientation.value ? 'Number of rows' : 'Number of columns'"
          [maxValue]="3"
          [minValue]="1"
          [step]="1"
          [canReset]="true"
          (doReset)="resetRapidButtonsColumns()"
        />
      </div>

      <app-number-input
        [formControl]="modalOpacity"
        label="Window opacity"
        [maxValue]="10"
        [minValue]="6"
        [step]="1"
        [canReset]="true"
        (doReset)="resetBestOf()"
      />

      <label class="settings-section__toggle-row">
        <span>Landscape mode</span>
        <input
          type="checkbox"
          [checked]="isLandscapeOrientation.value!"
          (change)="isLandscapeOrientation.setValue($any($event.target).checked)"
        />
      </label>
    </div>

    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveGuiPreferences()"
        [isDisabled]="!guiPreferencesValid()"
        label="Save changes"
        [tone]="
          !guiPreferencesValid() ? 'warning' : guiPreferencesUnchanged() ? 'neutral' : 'positive'
        "
      />
    </div>
  </div>

  @if (isAndroid) {
    <div class="settings-section">
      <h2 class="settings-section__title">Android</h2>
      <div class="settings-section__fields">
        <label class="settings-section__toggle-row">
          <span>Keep Awake (during match)</span>
          <input
            type="checkbox"
            [checked]="keepAwake.value!"
            (change)="keepAwake.setValue($any($event.target).checked)"
            [disabled]="keepAwake.disabled"
          />
        </label>
      </div>
      @if (keepAwakeSupported()) {
        <div class="settings-section__footer">
          <app-text-button
            (clicked)="saveKeepAwake()"
            [isDisabled]="keepAwakeUnchanged()"
            label="Save changes"
            [tone]="keepAwakeUnchanged() ? 'neutral' : 'positive'"
          />
        </div>
      }
    </div>
  }

  <div class="settings-section__about-footer" [class.landscape]="landscapeMode()">
    <app-text-button (clicked)="viewAboutModal()" label="About" tone="neutral" />
  </div>
</div>
