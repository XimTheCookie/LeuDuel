<div class="settings-page">
  <div class="settings-section">
    <h2 class="settings-section__title">Duel Settings</h2>

    <div class="settings-section__fields">
      <app-number-input
        [formControl]="lifePoints"
        label="Starting Life Points"
        [maxValue]="9999999"
        [minValue]="1"
        [step]="1000"
        [canReset]="true"
        (doReset)="lpReset()"
      />

      <app-number-input
        [formControl]="bestOf"
        label="Best of"
        [maxValue]="9"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetBestOf()"
      />

      <app-time-input
        [formControl]="duration"
        label="Duel Timer"
        [canReset]="true"
        (doReset)="resetTimer()"
      />
    </div>

    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveDuelSettings()"
        [isDisabled]="!duelSettingsValid()"
        label="Save changes"
        [tone]="!duelSettingsValid() ? 'warning' : duelSettingsUnchanged() ? 'neutral' : 'positive'"
      />
    </div>
  </div>

  <div class="settings-section">
    <h2 class="settings-section__title">Rapid Buttons</h2>

    <div class="settings-section__fields">
      <app-number-input
        [formControl]="numberOfRapidButtons"
        label="Number of rapid buttons"
        [maxValue]="15"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetRapidButtons()"
      />
      <app-number-input
        [formControl]="rapidButtonsColumns"
        label="Number of columns"
        [maxValue]="3"
        [minValue]="1"
        [step]="1"
        [canReset]="true"
        (doReset)="resetRapidButtonsColumns()"
      />
    </div>

    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveRapidButtonsSettings()"
        [isDisabled]="!rapidButtonsSettingsValid()"
        label="Save changes"
        [tone]="
          !rapidButtonsSettingsValid()
            ? 'warning'
            : rapidButtonsSettingsUnchanged()
              ? 'neutral'
              : 'positive'
        "
      />
    </div>
  </div>

  @if (isAndroid) {
  <div class="settings-section">
    <h2 class="settings-section__title">Android</h2>
    <div class="settings-section__fields">
      <label class="settings-section__toggle-row">
        <span>Keep Awake</span>
        <input type="checkbox" [checked]="keepAwake.value!" (change)="keepAwake.setValue($any($event.target).checked)" [disabled]="keepAwake.disabled" />
      </label>
    </div>
    @if (keepAwakeSupported()) {
    <div class="settings-section__footer">
      <app-text-button
        (clicked)="saveKeepAwake()"
        [isDisabled]="keepAwakeUnchanged()"
        label="Save changes"
        [tone]="keepAwakeUnchanged() ? 'neutral' : 'positive'"
      />
    </div>
    }
  </div>
  }

  <div class="settings-section__about-footer">
    <app-text-button (clicked)="viewAboutModal()" label="About" tone="neutral" />
  </div>
</div>
