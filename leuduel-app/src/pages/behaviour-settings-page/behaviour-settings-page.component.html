<div class="bs-page">
  <h2 class="bs-title">
    {{ 'behaviour-settings.title' | translate }}
  </h2>

  <div class="bs-list">
    @for (configKey of allConfigKeys; track configKey) {
      @let config = getOptionConfig(configKey);
      <div class="bs-list-item">
        <app-list-picker
          [formControl]="getFormControlForConfig(configKey)"
          [label]="config.label"
          [options]="config.values"
        />
        <app-button (clicked)="info(config.helper)" icon="info" size="2xs" tone="neutral" />
      </div>
    }
  </div>

  <div class="bs-footer">
    <app-text-button
      label="common.button.confirm"
      [isDisabled]="!settingsValid() || !settingsChanged()"
      [tone]="settingsValid() ? (settingsChanged() ? 'positive' : 'neutral') : 'negative'"
      (clicked)="confirm()"
    />
  </div>
</div>
