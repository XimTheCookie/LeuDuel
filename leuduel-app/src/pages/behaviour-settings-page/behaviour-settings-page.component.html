<div class="bs-page">
  <h2 class="bs-title">Behaviour Settings</h2>

  <div class="bs-list">
    <app-select-setting
      [control]="counterReset"
      [config]="configs.counterReset"
      label="Counters reset"
      [defaultValue]="1"
    />
    <app-select-setting
      [control]="gameReset"
      [config]="configs.gameReset"
      label="Game reset"
      [defaultValue]="0"
    />
    <app-select-setting
      [control]="winnerSelect"
      [config]="configs.winnerSelect"
      label="Winner selection"
      [defaultValue]="0"
    />
    <app-select-setting
      [control]="matchStop"
      [config]="configs.matchStop"
      label="Match stop"
      [defaultValue]="0"
    />
    <app-select-setting
      [control]="onStartup"
      [config]="configs.onStartup"
      label="On startup"
      [defaultValue]="0"
    />
  </div>

  <div class="bs-footer">
    <app-text-button
      label="Confirm"
      [isDisabled]="!settingsValid() || !settingsChanged()"
      [tone]="settingsValid() ? (settingsChanged() ? 'positive' : 'neutral') : 'negative'"
      (clicked)="confirm()"
    />
  </div>
</div>
