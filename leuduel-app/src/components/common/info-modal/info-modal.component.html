<div class="info-modal">
  <div class="info-modal__header">
    <span class="info-modal__title">{{ 'common.label.info' | translate }}</span>
  </div>

  <div>
    <span class="info-modal__label" [innerHTML]="infoText()"></span>
  </div>

  <div class="info-modal__actions">
    <app-text-button (click)="close()" label="common.button.close" tone="neutral" />
  </div>
</div>
