<div class="ss-container">
  @if (label()) {
    <div class="flex gap-2 w-full items-center">
      <button class="ss-btn" type="button" (click)="info()">ⓘ</button>
      <span class="ss-label">{{ label() | translate }}</span>
    </div>
  }
  <div class="ss-row">
    <div class="ss-row__items">
      @for (item of config().labels; track $index) {
        <button
          class="ss-btn"
          type="button"
          [class.ss-btn--active]="control().value === $index"
          (click)="select($index)"
        >
          {{ item | translate }}
        </button>
      }
    </div>
    <button class="ss-btn ss-btn--reset" type="button" (click)="reset()">↺</button>
  </div>
</div>
