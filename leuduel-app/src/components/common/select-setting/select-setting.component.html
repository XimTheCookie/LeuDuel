<div class="ss-container">
  @if (label()) {
    <span class="ss-label">{{ label() }}</span>
  }
  <div class="ss-row">
    @for (item of labels(); track $index) {
      <button
        class="ss-btn"
        type="button"
        [class.ss-btn--active]="control().value === $index"
        (click)="select($index)"
      >
        {{ item }}
      </button>
    }
    <button class="ss-btn ss-btn--reset" type="button" (click)="reset()">↺</button>
  </div>
</div>
