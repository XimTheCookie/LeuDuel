<div class="modal-wrapper" [class]="'modal-' + data.config.size" [style.opacity]="opacity()">
  @if (!data.config.hideClose) {
    <button class="modal-close" (click)="close()">✕</button>
  }
  <div class="modal-content">
    <ng-container #content />
  </div>
</div>
@if (tutorial.tutorialMode()) {
  <app-tutorial />
}
