<div class="ti-container">
  @if (label()) {
    <span class="ti-label">{{ label() }}</span>
  }
  <div [class.has-reset]="canReset()">
    @if (canReset()) {
      <button class="ni-btn" type="button" (click)="reset()">
        <app-icon icon="reset" size="sm" />
      </button>
    }
    <div class="ti-row" [class.ti-row--invalid]="formControl().invalid && formControl().touched">
      <div class="ti-segment">
        <button class="ni-btn" type="button" (click)="adjustHours(1)"><app-icon icon="plus" size="sm" /></button>
        <span class="ti-value">{{ pad(hours) }}</span>
        <button class="ni-btn" type="button" (click)="adjustHours(-1)" [disabled]="hours === 0">
          <app-icon icon="minus" size="sm" />
        </button>
      </div>
      <span class="ti-sep">:</span>
      <div class="ti-segment">
        <button class="ni-btn" type="button" (click)="adjustMinutes(1)"><app-icon icon="plus" size="sm" /></button>
        <span class="ti-value">{{ pad(minutes) }}</span>
        <button
          class="ni-btn"
          type="button"
          (click)="adjustMinutes(-1)"
          [disabled]="minutes === 0 && hours === 0"
        >
          <app-icon icon="minus" size="sm" />
        </button>
      </div>
      <span class="ti-sep">:</span>
      <div class="ti-segment">
        <button class="ni-btn" type="button" (click)="adjustSeconds(1)"><app-icon icon="plus" size="sm" /></button>
        <span class="ti-value">{{ pad(seconds) }}</span>
        <button
          class="ni-btn"
          type="button"
          (click)="adjustSeconds(-1)"
          [disabled]="seconds === 0 && minutes === 0 && hours === 0"
        >
          <app-icon icon="minus" size="sm" />
        </button>
      </div>
    </div>
  </div>
</div>
