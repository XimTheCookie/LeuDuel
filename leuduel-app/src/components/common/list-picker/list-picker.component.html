<div class="lp-container">
  @if (label()) {
    <span class="lp-label">{{ label() | translate }}</span>
  }
  <div [class.has-reset]="canReset()" [class.lp-disabled]="disabled()">
    @if (canReset()) {
      <button class="lp-btn" type="button" (click)="doReset.emit()">
        <app-icon icon="reset" size="sm" />
      </button>
    }
    <button class="lp-trigger" type="button" (click)="open()" [disabled]="disabled()">
      <span>{{ optionLabel ?? '—' | translate }}</span>
      <span class="lp-arrow">▾</span>
    </button>
  </div>
</div>

@if (isOpen()) {
  <div class="lp-backdrop" (click)="close()"></div>
  <div
    class="lp-sheet"
    [style.transform]="sheetTransform"
    [class.lp-sheet--dragging]="dragDelta() > 0"
  >
    <div class="lp-sheet__handle">
      <div
        (touchstart)="onHandleTouchStart($event)"
        (touchmove)="onHandleTouchMove($event)"
        (touchend)="onHandleTouchEnd()"
      ></div>
    </div>
    <div class="lp-sheet__list">
      @for (option of options(); track option) {
        <button
          class="lp-option"
          type="button"
          [class.lp-option--active]="formControl().value === option.value"
          (click)="select(option.value)"
        >
          {{ option.label | translate }}
        </button>
      }
    </div>
  </div>
}
