<div class="rp" [class.rp--done]="done()">
  @for (col of cols; track col) {
    <div class="rp__col">
      @for (row of rows; track row) {
        <div class="rp__cell" [class.rp__cell--on]="grid()[col][row]"></div>
      }
    </div>
  }
  @if (done()) {
    <div class="rp__winner">
      <span>{{ 'common.label.winner' | translate }}</span>
    </div>
  }
</div>
