<div class="modify-form">
  <h2 class="modify-form__title">Modify Button</h2>

  <div class="modify-form__section">
    <app-number-input
      label="Value"
      [formControl]="buttonValueController"
      [minValue]="1"
      [maxValue]="99999"
      [step]="100"
    />
  </div>

  <div class="modify-form__section">
    <span class="modify-form__label">Action Type</span>
    <div class="modify-form__types">
      @for (t of actionTypes; track t.type) {
        <button
          class="type-btn"
          [class.type-btn--active]="selectedType() === t.type"
          [class.type-btn--damage]="t.type === 'damage'"
          [class.type-btn--heal]="t.type === 'heal'"
          [class.type-btn--divide]="t.type === 'divide'"
          [class.type-btn--multiply]="t.type === 'multiply'"
          [class.type-btn--set]="t.type === 'set'"
          type="button"
          (click)="selectType(t.type)"
        >
          <span class="type-btn__symbol">{{ t.symbol }}</span>
          <span class="type-btn__label">{{ t.label }}</span>
        </button>
      }
    </div>
  </div>

  <div class="modify-form__footer">
    <span class="modify-form__footer_label">(Configurations are shared)</span>
    <app-text-button
      [tone]="buttonValueController.invalid ? 'neutral' : 'positive'"
      [isDisabled]="buttonValueController.invalid"
      (clicked)="save()"
      label="Confirm"
    />
  </div>
</div>
