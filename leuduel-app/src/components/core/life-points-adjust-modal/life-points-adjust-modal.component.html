<div class="lpa" [class.lpa--landscape]="settingsService.landscapeMode()">
  @if (!settingsService.landscapeMode()) {
    <span class="lpa__title">
      {{ 'common.label.set-lp-title' | translate: { player: playerName() } }}</span
    >
  }

  @if (player) {
    <app-life-points-calculator [player]="player" (applied)="close()" />
  }
</div>
