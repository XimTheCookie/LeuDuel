<div class="ct">
  <div class="ct__field">
    <button class="ct__btn" type="button" (click)="fzSet()">
      {{ playerFz() }}
    </button>
    @for (mz of playerMz(); let i = $index; track i) {
      <button class="ct__btn" type="button" (click)="mzSet(i)">
        {{ mz }}
      </button>
    }
    <div class="ct__btn"></div>
  </div>
  <div class="ct__field">
    <div class="ct__btn"></div>
    @for (stz of playerStz(); let i = $index; track i) {
      <button class="ct__btn" type="button" (click)="stzSet(i)">
        {{ stz }}
      </button>
    }
    <div class="ct__btn"></div>
  </div>
</div>
