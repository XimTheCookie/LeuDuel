<div
  class="lp-display"
  [class.lp-display--bg]="hasDefaultBg()"
  [class.lp-display--compact]="compact()"
  [class.animating]="animating()"
  [class.gaining]="animating() && gaining()"
>
  <app-button
    size="xs"
    class="lp-display__player-condition"
    icon="clipboard-list"
    (click)="$event.preventDefault()"
    (clicked)="openConditionPage()"
  />
  @if (playerName() && compact()) {
    <span class="lp-player">{{ playerName() }}</span>
  }
  <span class="lp-value leu-lbl-lp" (click)="lpClick.emit()">{{
    displayValue() ?? lifePoints()
  }}</span>
  <span class="lp-label">LP</span>
  @if (unduable()) {
    <app-button
      size="xs"
      class="lp-undo"
      icon="reset"
      (click)="$event.preventDefault()"
      (clicked)="undoLifeAction()"
    />
  }
</div>
