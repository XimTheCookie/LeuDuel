<div class="controller">
  <div class="controller__row">
    <div class="controller__side">
      <app-button
        (clicked)="viewLog()"
        [isDisabled]="!duelStore.isDuelStarted()"
        icon="log"
        label="Log"
        size="xs"
        tone="neutral"
      />
    </div>
    <app-timer />
    <div class="controller__side controller__side--right">
      <app-button
        (clicked)="openJudgePage()"
        icon="rules"
        label="Rulings"
        tone="neutral"
        size="xs"
      />
    </div>
  </div>

  <div class="controller__actions">
    <div class="controller__side-actions">
      <app-button
        (clicked)="stopMatch()"
        icon="reset"
        label="Stop match"
        [isDisabled]="duelStore.isDuelFinished()"
        size="xs"
        tone="warning"
      />
      <app-button
        (clicked)="resetLifePoints()"
        icon="heart-reset"
        label="Reset LP"
        [isDisabled]="!duelStore.isDuelStarted()"
        size="xs"
        tone="negative"
      />
    </div>

    <div class="controller__main-btn">
      @if (duelStore.isDuelPaused()) {
        <app-button (clicked)="resumeDuel()" icon="play" label="Resume" size="xl" tone="positive" />
      } @else if (duelStore.isDuelStarted()) {
        <app-button (clicked)="pauseDuel()" icon="pause" label="Pause" size="xl" tone="warning" />
      } @else {
        <app-button (clicked)="startDuel()" icon="play" label="Play" size="xl" tone="positive" />
      }
    </div>

    <div class="controller__extra-actions">
      <div class="controller__side-settings">
        <app-button icon="dices" size="xs" tone="neutral" (clicked)="openToolsPage()" />
        <app-button icon="coins" size="xs" tone="neutral" (clicked)="openCountersPage()" />
      </div>
      <div class="controller__side-settings">
        <app-button
          (clicked)="openSettings()"
          icon="settings"
          label="Settings"
          [isDisabled]="duelStore.isDuelStarted() || duelStore.isDuelPaused()"
          size="xs"
          tone="neutral"
        />
        <app-button
          (clicked)="toggleSounds()"
          [icon]="settingsService.soundsOn() ? 'volume' : 'volume-off'"
          label="Settings"
          size="xs"
          [tone]="settingsService.soundsOn() ? 'neutral' : 'negative'"
        />
      </div>
    </div>
  </div>
</div>
