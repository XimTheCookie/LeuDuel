<div class="controller">
  <div class="controller__layout" id="leu-ctn-controller">
    <div class="controller__grid-left">
      <app-button
        id="leu-btn-settings"
        (clicked)="openSettings()"
        icon="settings"
        label="Settings"
        [isDisabled]="duelStore.isDuelStarted() || duelStore.isDuelPaused()"
        size="xs"
        tone="neutral"
      />
      <app-button
        id="leu-btn-logs"
        (clicked)="viewLog()"
        [isDisabled]="!duelStore.isDuelStarted()"
        icon="log"
        label="Log"
        size="xs"
        tone="neutral"
      />

      <!-- [isDisabled]="duelStore.isDuelFinished()" -->
      <app-button
        id="leu-btn-stop"
        (clicked)="stopMatch()"
        icon="reset"
        label="Stop"
        size="xs"
        tone="warning"
      />

      <!-- [isDisabled]="!duelStore.isDuelStarted()" -->
      <app-button
        id="leu-btn-reset"
        (clicked)="resetLifePoints()"
        icon="heart-reset"
        label="Reset LP"
        size="xs"
        tone="negative"
      />
    </div>

    <div class="controller__center">
      <app-timer />
      <div class="controller__main-btn" id="leu-btn-match">
        @if (duelStore.isDuelPaused()) {
          <app-button
            (clicked)="resumeDuel()"
            icon="play"
            label="Resume"
            size="md"
            tone="positive"
          />
        } @else if (duelStore.isDuelStarted()) {
          <app-button (clicked)="pauseDuel()" icon="pause" label="Pause" size="md" tone="warning" />
        } @else {
          <app-button (clicked)="startDuel()" icon="play" label="Play" size="md" tone="positive" />
        }
      </div>
    </div>

    <div class="controller__grid-right" id="leu-ctn-utils">
      <app-button
        icon="coins"
        size="xs"
        tone="neutral"
        id="leu-btn-counters"
        (clicked)="openCountersPage()"
      />
      <app-button
        id="leu-btn-rules"
        (clicked)="openJudgePage()"
        icon="rules"
        label="Rulings"
        tone="neutral"
        size="xs"
      />
      <app-button
        id="leu-btn-tools"
        icon="dices"
        size="xs"
        tone="neutral"
        (clicked)="openToolsPage()"
      />
      <app-button
        id="leu-btn-sounds"
        (clicked)="toggleSounds()"
        [icon]="settingsService.soundsOn() ? 'volume' : 'volume-off'"
        label="Sound"
        size="xs"
        [tone]="settingsService.soundsOn() ? 'neutral' : 'negative'"
      />
    </div>
  </div>
</div>
