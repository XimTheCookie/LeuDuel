<div class="profile-editor">
  <div class="profile-editor__header">
    <span class="profile-editor__title">
      {{
        (data.mode === 'main'
          ? 'profiles-page.my-profile'
          : data.opponent
            ? 'profiles-page.edit-opponent'
            : 'profiles-page.add-opponent'
        ) | translate
      }}
    </span>
  </div>

  <div class="profile-editor__preview">
    <app-player-profile [profile]="preview()" [showName]="true" [showAvatar]="true" />
    <app-text-button
      (clicked)="clearCard()"
      [isDisabled]="!selectedCardUrl()"
      [tone]="!selectedCardUrl() ? 'neutral' : 'negative'"
      label="common.button.remove"
    />
  </div>

  <div class="profile-editor__field">
    <label class="profile-editor__label">
      {{ 'profiles-page.display-name' | translate }}
    </label>
    <input
      class="profile-editor__input"
      type="text"
      [maxLength]="32"
      [placeholder]="'profiles-page.enter-name' | translate"
      [ngModel]="displayName()"
      (ngModelChange)="displayName.set($event)"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div class="profile-editor__section-title">
    {{ 'profiles-page.profile-picture' | translate }}
  </div>
  <app-card-search (cardSelected)="onCardSelected($event)" />

  <div class="profile-editor__footer">
    <app-text-button
      label="common.button.save"
      tone="positive"
      [isDisabled]="!canSave()"
      (clicked)="save()"
    />
  </div>
</div>
