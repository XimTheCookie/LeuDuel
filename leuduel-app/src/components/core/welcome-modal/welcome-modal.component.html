<div class="welcome">
  <div class="welcome__header">
    <span class="welcome__title">Welcome</span>
    <p class="welcome__subtitle">How would you like the app?</p>
  </div>

  <div class="welcome__divider">
    <span class="welcome__divider-gem"></span>
  </div>

  <div class="welcome__actions">
    <app-text-button label="Portrait" tone="neutral" (clicked)="selectMode(false)" />
    <app-text-button label="Landscape" tone="neutral" (clicked)="selectMode(true)" />
  </div>
</div>
