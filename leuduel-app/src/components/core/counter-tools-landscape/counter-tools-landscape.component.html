<div class="ctl" [class.p2]="player() === 2">
  @if (player() === 1) {
    <div class="ctl__field">
      <div class="ctl__btn"></div>
      @for (mz of playerMzReversed(); let i = $index; track i) {
        <button class="ctl__btn" type="button" (click)="mzSet(reversedMzIndex(i))">
          {{ mz }}
        </button>
      }
      <button class="ctl__btn" type="button" (click)="fzSet()">
        {{ playerFz() }}
      </button>
    </div>
    <div class="ctl__field">
      <div class="ctl__btn"></div>
      @for (stz of playerStzReversed(); let i = $index; track i) {
        <button class="ctl__btn" type="button" (click)="stzSet(reversedStzIndex(i))">
          {{ stz }}
        </button>
      }
      <div class="ctl__btn"></div>
    </div>
  } @else {
    <div class="ctl__field">
      <div class="ctl__btn"></div>
      @for (stz of playerStz(); let i = $index; track i) {
        <button class="ctl__btn" type="button" (click)="stzSet(i)">
          {{ stz }}
        </button>
      }
      <div class="ctl__btn"></div>
    </div>
    <div class="ctl__field">
      <button class="ctl__btn" type="button" (click)="fzSet()">
        {{ playerFz() }}
      </button>
      @for (mz of playerMz(); let i = $index; track i) {
        <button class="ctl__btn" type="button" (click)="mzSet(i)">
          {{ mz }}
        </button>
      }
      <div class="ctl__btn"></div>
    </div>
  }
</div>
