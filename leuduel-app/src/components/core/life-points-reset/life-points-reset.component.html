<div class="lp-reset">
  <div class="lp-reset__header">
    <span class="lp-reset__title">New Duel?</span>
    @if (isOngoing()) {
      <p class="lp-reset__subtitle">Timer is still ticking.</p>
    }
  </div>

  <div class="lp-reset__divider">
    <span class="lp-reset__divider-gem"></span>
  </div>

  <div class="lp-reset__winner">
    <span class="lp-reset__winner-label">Assign Victory</span>
    <div class="lp-reset__winner-btns">
      <div class="lp-reset__player-col">
        @if (showProfiles() && profile1()) {
          <app-player-profile [profile]="profile1()!" [showAvatar]="true" [showName]="false" [small]="true" />
        }
        <app-button
          [label]="duelStore.player1().name"
          [icon]="isLandscape() ? 'arrow-left' : 'arrow-down'"
          size="md"
          [tone]="selectedPlayer() === 'player1' ? 'positive' : 'neutral'"
          (clicked)="togglePlayer('player1')"
        />
      </div>
      <div class="lp-reset__player-col">
        <app-button
          label="None"
          icon="ban"
          size="md"
          [tone]="selectedPlayer() === null ? 'warning' : 'neutral'"
          (clicked)="togglePlayer(null)"
        />
      </div>
      <div class="lp-reset__player-col">
        @if (showProfiles() && profile2()) {
          <app-player-profile [profile]="profile2()!" [showAvatar]="true" [showName]="false" [small]="true" />
        }
        <app-button
          [label]="duelStore.player2().name"
          [icon]="isLandscape() ? 'arrow-right' : 'arrow-up'"
          size="md"
          [tone]="selectedPlayer() === 'player2' ? 'positive' : 'neutral'"
          (clicked)="togglePlayer('player2')"
        />
      </div>
    </div>
  </div>

  <div class="lp-reset__actions">
    <app-text-button label="Confirm" tone="negative" (clicked)="closeModal(true)" />
    <app-text-button label="Cancel" tone="neutral" (clicked)="closeModal(false)" />
  </div>
</div>
