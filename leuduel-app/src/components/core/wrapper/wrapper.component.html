<div class="wrapper-container__bg">
  @if (documentVisible()) {
    @switch (background()) {
      @case (1) {
        <app-stars-wallpaper />
      }
      @case (2) {
        <app-flames-wallpaper />
      }
      @case (3) {
        <app-lines-wallpaper />
      }
      @case (4) {
        <app-meteorites-wallpaper />
      }
    }
  }
</div>
<div class="wrapper-container__app">
  <app-duel-page />
</div>
