<div class="wrapper-container__bg">
  @if (documentVisible()) {
    @switch (background()) {
      @case (1) {
        <app-snow-wallpaper />
      }
      @case (2) {
        <app-embers-wallpaper />
      }
      @case (3) {
        <app-lines-wallpaper />
      }
      @case (4) {
        <app-rain-wallpaper />
      }
      @case (5) {
        <app-aurora-wallpaper />
      }
      @case (6) {
        <app-bubbles-wallpaper />
      }
    }
  }
</div>
<div class="wrapper-container__app">
  <app-duel-page />
</div>
<app-snackbar />
@if (tutorialService.tutorialMode() && !modalService.hasOpenModal()) {
  <app-tutorial />
}
